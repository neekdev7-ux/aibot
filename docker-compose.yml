services:
  db:
    image: postgres:16
    container_name: niva-db
    environment:
      POSTGRES_USER: niva
      POSTGRES_PASSWORD: niva_dev_password
      POSTGRES_DB: niva_quant
    ports:
      - "5432:5432"
    volumes:
      - niva_pgdata:/var/lib/postgresql/data
      # schema.sql is applied automatically on first boot only.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niva -d niva_quant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: niva-redis
    ports:
      - "6379:6379"
    volumes:
      - niva_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: niva-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://niva:niva_dev_password@db:5432/niva_quant
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  niva_pgdata:
  niva_redisdata:
